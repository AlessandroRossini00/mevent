<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline - Mevent</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0b;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.04);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 20px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.78);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: white;
        color: black;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sei offline</h1>
      <p>
        Al momento non c&apos;&egrave; connessione. Controlla la rete e prova a
        ricaricare la pagina.
      </p>
      <button onclick="window.location.reload()">Riprova</button>
    </div>
  </body>
</html>
